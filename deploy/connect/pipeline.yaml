input:
  kafka_franz:
    seed_brokers: [redpanda:9092]
    topics: [weather.bronze]
    consumer_group: connect-gold
    start_from_oldest: true

pipeline:
  processors:
    # Turns one raw API body into an array of gold.observations rows. All-or-nothing: any problem
    # raises an error that starts with a reason code, which marks the whole message as failed.
    - label: to_rows
      mapping: |
        let source = metadata("source").or("")
        let body = content().parse_json().catch(null)
        if $body == null {
          root = throw("invalid_json: body is not valid JSON")
        }

        # The lineage headers feed NOT NULL columns. Reject a record that lacks them here: a constraint
        # violation in the SQL output would be retried forever and stall the whole stream.
        let fetched_at = metadata("fetched_at").or("")
        if $fetched_at.type() != "string" || $fetched_at.ts_parse("2006-01-02T15:04:05Z07:00").catch(null) == null {
          root = throw("missing_header: fetched_at is missing or not RFC3339")
        }
        let payload_sha256 = metadata("payload_sha256").or("")
        if $payload_sha256.type() != "string" || $payload_sha256 == "" {
          root = throw("missing_header: payload_sha256 is missing")
        }

        let allowed_regions = ["north", "south", "east", "west", "central"]
        let ts_layout = "2006-01-02T15:04:05Z07:00"
        let lineage = {
          "ingested_at": metadata("fetched_at"),
          "bronze_partition": metadata("kafka_partition").number(),
          "bronze_offset": metadata("kafka_offset").number(),
          "payload_sha256": metadata("payload_sha256")
        }

        if $source == "pm25" || $source == "psi" {
          let item = $body.data.items.index(0).catch(null)
          if $item == null || $item.type() != "object" {
            root = throw("unexpected_shape: data.items[0] is missing")
          }
          if $item.timestamp.type() != "string" || $item.timestamp.ts_parse($ts_layout).catch(null) == null ||
             $item.updatedTimestamp.type() != "string" || $item.updatedTimestamp.ts_parse($ts_layout).catch(null) == null {
            root = throw("unexpected_shape: timestamp or updatedTimestamp is missing or not RFC3339")
          }
          if $item.readings.type() != "object" {
            root = throw("unexpected_shape: readings is not an object")
          }
          let rows = $item.readings.key_values().map_each(m -> if m.value.type() != "object" {
              throw("unexpected_shape: readings." + m.key + " is not an object")
            } else {
              m.value.key_values().map_each(r -> if !$allowed_regions.contains(r.key) {
                  throw("unknown_region: " + r.key)
                } else if r.value.type() != "number" {
                  throw("non_numeric_value: " + m.key + "/" + r.key)
                } else if r.value.abs() > 1000000000 {
                  throw("value_out_of_range: " + m.key + "/" + r.key)
                } else {
                  {
                    "source": $source,
                    "metric": m.key,
                    "region": r.key,
                    "observed_at": $item.timestamp,
                    "source_updated_at": $item.updatedTimestamp,
                    "value": r.value,
                    "unit": if m.key == "pm25_one_hourly" { "ug/m3" } else { null }
                  }.merge($lineage)
                }
              )
            }
          ).flatten()
          if $rows.length() == 0 {
            root = throw("unexpected_shape: no readings")
          }
          root = $rows
        } else if $source == "uv" {
          let rec = $body.data.records.index(0).catch(null)
          if $rec == null || $rec.type() != "object" {
            root = throw("unexpected_shape: data.records[0] is missing")
          }
          if $rec.updatedTimestamp.type() != "string" || $rec.updatedTimestamp.ts_parse($ts_layout).catch(null) == null {
            root = throw("unexpected_shape: updatedTimestamp is missing or not RFC3339")
          }
          if $rec.index.type() != "array" || $rec.index.length() == 0 {
            root = throw("unexpected_shape: uv index is empty")
          }
          root = $rec.index.map_each(e -> if e.hour.type() != "string" || e.hour.ts_parse($ts_layout).catch(null) == null {
              throw("unexpected_shape: uv hour is missing or not RFC3339")
            } else if e.value.type() != "number" {
              throw("non_numeric_value: uv_index/" + e.hour)
            } else if e.value.abs() > 1000000000 {
              throw("value_out_of_range: uv_index/" + e.hour)
            } else {
              {
                "source": "uv",
                "metric": "uv_index",
                "region": "national",
                "observed_at": e.hour,
                "source_updated_at": $rec.updatedTimestamp,
                "value": e.value,
                "unit": null
              }.merge($lineage)
            }
          )
        } else {
          root = throw("unexpected_shape: unknown source " + $source)
        }

    - switch:
        - check: '!errored()'
          processors:
            - unarchive:
                format: json_array

    # A message that failed mapping is a permanent failure: record why and where it came from so it can
    # be replayed. (Errors from the SQL output below are temporary and are retried, never dead-lettered.)
    - switch:
        - check: errored()
          processors:
            - mutation: |
                meta error = error()
                meta stage = "mapping"
                meta source_partition = metadata("kafka_partition")
                meta source_offset = metadata("kafka_offset")

output:
  switch:
    cases:
      - check: errored()
        output:
          kafka_franz:
            seed_brokers: [redpanda:9092]
            topic: weather.dlq
            key: ${! metadata("kafka_key") }
            metadata:
              include_patterns:
                - '^(source|fetched_at|payload_sha256|error|stage|source_partition|source_offset)$'
      - output:
          sql_raw:
            driver: postgres
            dsn: postgres://connect_rw:${CONNECT_RW_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
            query: |
              INSERT INTO gold.observations
                (source, metric, region, observed_at, source_updated_at, value, unit,
                 ingested_at, bronze_partition, bronze_offset, payload_sha256)
              VALUES ($1, $2, $3, $4::timestamptz, $5::timestamptz, $6, $7,
                      $8::timestamptz, $9, $10, $11)
              ON CONFLICT (source, metric, region, observed_at) DO UPDATE SET
                source_updated_at = EXCLUDED.source_updated_at,
                value             = EXCLUDED.value,
                unit              = EXCLUDED.unit,
                ingested_at       = EXCLUDED.ingested_at,
                bronze_partition  = EXCLUDED.bronze_partition,
                bronze_offset     = EXCLUDED.bronze_offset,
                payload_sha256    = EXCLUDED.payload_sha256
              WHERE EXCLUDED.source_updated_at > gold.observations.source_updated_at
            args_mapping: |
              root = [
                this.source, this.metric, this.region, this.observed_at, this.source_updated_at,
                this.value, this.unit, this.ingested_at, this.bronze_partition, this.bronze_offset,
                this.payload_sha256
              ]
